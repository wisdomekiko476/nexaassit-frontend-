<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login | NexaAssist</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f8fc;
      color: #172033;
    }

    a {
      text-decoration: none;
    }

    .navbar {
      height: 72px;
      background: #ffffff;
      border-bottom: 1px solid #e7edf5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 7%;
    }

    .logo {
      font-size: 23px;
      font-weight: 800;
      color: #155eef;
    }

    .home-link {
      color: #526071;
      font-size: 14px;
      font-weight: 600;
    }

    .home-link:hover {
      color: #155eef;
    }

    .page {
      min-height: calc(100vh - 72px);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 45px 20px;
    }

    .login-card {
      width: 100%;
      max-width: 440px;
      background: #ffffff;
      border: 1px solid #e5ebf3;
      border-radius: 18px;
      padding: 38px;
      box-shadow: 0 15px 40px rgba(18, 38, 63, 0.08);
    }

    .intro {
      text-align: center;
      margin-bottom: 28px;
    }

    .intro h1 {
      margin: 0 0 10px;
      font-size: 30px;
      color: #172033;
    }

    .intro p {
      margin: 0;
      color: #667085;
      font-size: 15px;
      line-height: 1.6;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 700;
      color: #344054;
    }

    input,
    select {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #d0d5dd;
      border-radius: 9px;
      background: #ffffff;
      font-size: 15px;
      color: #172033;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #155eef;
      box-shadow: 0 0 0 3px rgba(21, 94, 239, 0.10);
    }

    .login-button {
      width: 100%;
      border: none;
      border-radius: 9px;
      padding: 14px;
      background: #155eef;
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 5px;
    }

    .login-button:hover {
      background: #0f4dcc;
    }

    .login-button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.5;
    }

    .message.success {
      display: block;
      background: #ecfdf3;
      color: #067647;
      border: 1px solid #abefc6;
    }

    .message.error {
      display: block;
      background: #fef3f2;
      color: #b42318;
      border: 1px solid #fecdca;
    }

    .signup-text {
      text-align: center;
      margin: 23px 0 0;
      font-size: 14px;
      color: #667085;
    }

    .signup-text a {
      color: #155eef;
      font-weight: 700;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: #667085;
      font-size: 13px;
    }

    .back-link:hover {
      color: #155eef;
    }

    .footer-note {
      text-align: center;
      margin-top: 22px;
      font-size: 12px;
      color: #98a2b3;
      line-height: 1.5;
    }

    @media (max-width: 600px) {
      .navbar {
        padding: 0 20px;
      }

      .login-card {
        padding: 28px 22px;
      }

      .intro h1 {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>

  <nav class="navbar">
    <a href="index.html" class="logo">NexaAssist</a>
    <a href="index.html" class="home-link">Home</a>
  </nav>

  <main class="page">

    <section class="login-card">

      <div class="intro">
        <h1>Welcome back</h1>
        <p>Log in to your NexaAssist account and continue where you left off.</p>
      </div>

      <form id="loginForm">

        <div class="form-group">
          <label for="email">Email Address</label>
          <input
            type="email"
            id="email"
            placeholder="you@example.com"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            placeholder="Enter your password"
            required
          >
        </div>

        <div class="form-group">
          <label for="role">Account Type</label>
          <select id="role" required>
            <option value="">Choose your account type</option>
            <option value="customer">I want to hire a Virtual Assistant</option>
            <option value="assistant">I want to become a Virtual Assistant</option>
            <option value="admin">Admin</option>
          </select>
        </div>

        <button type="submit" class="login-button" id="loginButton">
          Log In
        </button>

        <div id="message" class="message"></div>

      </form>

      <p class="signup-text">
        Don't have an account?
        <a href="signup.html">Create one</a>
      </p>

      <a href="index.html" class="back-link">
        ← Back to NexaAssist
      </a>

      <div class="footer-note">
        Secure access to your NexaAssist account.
      </div>

    </section>

  </main>

  <script>
    const API_URL =
      "https://nexaassist-backend-new-1.onrender.com";

    const loginForm =
      document.getElementById("loginForm");

    const loginButton =
      document.getElementById("loginButton");

    const message =
      document.getElementById("message");

    loginForm.addEventListener("submit", async function (event) {

      event.preventDefault();

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      const role =
        document.getElementById("role").value;

      message.className = "message";
      message.textContent = "";

      if (!email || !password || !role) {
        message.className = "message error";
        message.textContent =
          "Please fill in all fields.";
        return;
      }

      loginButton.disabled = true;
      loginButton.textContent = "Logging in...";

      try {

        const response = await fetch(
          `${API_URL}/login`,
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              email: email,
              password: password,
              role: role
            })
          }
        );

        let data = {};

        try {
          data = await response.json();
        } catch (error) {
          data = {};
        }

        if (!response.ok) {
          throw new Error(
            data.message ||
            "Login failed. Please check your details."
          );
        }

        localStorage.setItem(
          "user",
          JSON.stringify(data)
        );

        localStorage.setItem(
          "userEmail",
          data.email || email
        );

        localStorage.setItem(
          "userRole",
          data.role || role
        );

        message.className = "message success";
        message.textContent =
          "Login successful. Redirecting...";

        setTimeout(function () {

          if (data.role === "admin" || role === "admin") {
            window.location.href = "admin.html";

          } else if (
            data.role === "assistant" ||
            role === "assistant"
          ) {
            window.location.href = "assistant.html";

          } else {
            window.location.href = "customer.html";
          }

        }, 700);

      } catch (error) {

        console.error("Login error:", error);

        message.className = "message error";
        message.textContent =
          error.message ||
          "Unable to log in. Please try again.";

        loginButton.disabled = false;
        loginButton.textContent = "Log In";
      }

    });
  </script>

</body>
</html>
