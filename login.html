<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - NexaAssist</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
      background: #fff;
      padding: 35px 28px;
      border-radius: 14px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    .logo {
      text-align: center;
      color: #1769aa;
      font-size: 30px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
      color: #333;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-bottom: 18px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #1769aa;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    #message {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
    }

    .signup {
      text-align: center;
      margin-top: 20px;
      color: #666;
    }

    .signup a {
      color: #1769aa;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">NexaAssist</div>

    <div class="subtitle">
      Sign in to your account
    </div>

    <form id="loginForm">

      <label for="email">Email</label>

      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
      >

      <label for="password">Password</label>

      <input
        type="password"
        id="password"
        placeholder="Enter your password"
        required
      >

      <button type="submit" id="loginButton">
        Login
      </button>

    </form>

    <div id="message"></div>

    <div class="signup">
      Don't have an account?
      <a href="signup.html">Create one</a>
    </div>

  </div>

  <script>

    const API =
      "https://nexaassist-backend-new-1.onrender.com";

    const form =
      document.getElementById("loginForm");

    const button =
      document.getElementById("loginButton");

    const message =
      document.getElementById("message");


    form.addEventListener("submit", async function(event) {

      event.preventDefault();

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;


      message.textContent = "Logging in...";
      message.style.color = "#1769aa";

      button.disabled = true;


      try {

        const response = await fetch(API + "/login", {

          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            email: email,
            password: password
          })

        });


        const data = await response.json();


        if (!response.ok) {

          throw new Error(
            data.message || "Login failed"
          );

        }


        /*
          Save user information
        */

        const loggedEmail =
          (data.email || email).trim();

        const loggedRole =
          (data.role || "").toLowerCase().trim();


        localStorage.setItem(
          "userId",
          data.id || ""
        );

        localStorage.setItem(
          "userEmail",
          loggedEmail
        );

        localStorage.setItem(
          "userName",
          data.fullName || ""
        );

        localStorage.setItem(
          "userRole",
          loggedRole
        );


        /*
          Compatibility keys
        */

        localStorage.setItem(
          "email",
          loggedEmail
        );

        localStorage.setItem(
          "role",
          loggedRole
        );


        message.textContent =
          "Login successful. Redirecting...";

        message.style.color = "green";


        setTimeout(function() {

          /*
            ADMIN
          */

          if (
            loggedEmail.toLowerCase() ===
            "wissywax@gmail.com"
          ) {

            window.location.href =
              "admin.html";

            return;
          }


          /*
            ASSISTANT
          */

          if (loggedRole === "assistant") {

            window.location.href =
              "assistant.html";

            return;
          }


          /*
            CUSTOMER / CLIENT
          */

          window.location.href =
            "profile.html";

        }, 700);


      } catch (error) {

        message.textContent =
          error.message ||
          "Unable to login.";

        message.style.color = "red";

        button.disabled = false;

      }

    });

  </script>

</body>
</html>
