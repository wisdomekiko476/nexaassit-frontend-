<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assistant Dashboard - NexaAssist</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #172033;
    }

    header {
      background: #1769aa;
      color: white;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 23px;
      font-weight: bold;
    }

    .logout {
      background: white;
      color: #1769aa;
      border: none;
      padding: 9px 15px;
      border-radius: 7px;
      font-weight: bold;
      cursor: pointer;
    }

    .container {
      width: 92%;
      max-width: 1100px;
      margin: 30px auto;
    }

    .welcome {
      background: white;
      padding: 25px;
      border-radius: 14px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.06);
      margin-bottom: 25px;
    }

    .welcome h1 {
      margin: 0 0 8px;
      font-size: 27px;
    }

    .welcome p {
      margin: 5px 0;
      color: #667085;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      margin-bottom: 30px;
    }

    .stat {
      background: white;
      padding: 22px;
      border-radius: 14px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.05);
    }

    .stat h3 {
      margin: 0 0 10px;
      color: #667085;
      font-size: 15px;
    }

    .stat strong {
      font-size: 30px;
      color: #1769aa;
    }

    .section {
      background: white;
      padding: 25px;
      border-radius: 14px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.05);
      margin-bottom: 25px;
    }

    .section h2 {
      margin-top: 0;
    }

    .job {
      border: 1px solid #e4e7ec;
      border-radius: 10px;
      padding: 18px;
      margin-bottom: 15px;
    }

    .job:last-child {
      margin-bottom: 0;
    }

    .job h3 {
      margin: 0 0 7px;
    }

    .job p {
      margin: 5px 0;
      color: #667085;
    }

    .status {
      display: inline-block;
      margin-top: 10px;
      padding: 5px 10px;
      border-radius: 20px;
      background: #eaf7ee;
      color: #16803c;
      font-size: 13px;
      font-weight: bold;
    }

    .empty {
      color: #667085;
      padding: 10px 0;
    }

    footer {
      text-align: center;
      padding: 30px 20px;
      color: #667085;
      font-size: 14px;
    }

    @media (max-width: 750px) {
      .cards {
        grid-template-columns: 1fr;
      }

      header {
        padding: 15px;
      }

      .container {
        width: 94%;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">NexaAssist</div>
  <button class="logout" onclick="logout()">Logout</button>
</header>

<div class="container">

  <div class="welcome">
    <h1>Assistant Dashboard</h1>
    <p id="welcomeText">Welcome back.</p>
    <p id="emailText"></p>
  </div>

  <div class="cards">

    <div class="stat">
      <h3>My Hired Jobs</h3>
      <strong id="hiredCount">0</strong>
    </div>

    <div class="stat">
      <h3>Available Jobs</h3>
      <strong id="jobCount">0</strong>
    </div>

    <div class="stat">
      <h3>Account Status</h3>
      <strong id="accountStatus">Active</strong>
    </div>

  </div>

  <div class="section">
    <h2>My Hired Jobs</h2>
    <div id="hiredJobs">
      <div class="empty">Loading your hired jobs...</div>
    </div>
  </div>

  <div class="section">
    <h2>Available Jobs</h2>
    <div id="availableJobs">
      <div class="empty">Loading available jobs...</div>
    </div>
  </div>

</div>

<footer>
  NexaAssist — Reliable virtual assistance for growing businesses.
</footer>

<script>

const API = "https://nexaassist-backend-new-1.onrender.com";

const email =
  localStorage.getItem("userEmail") ||
  localStorage.getItem("email") ||
  "";

const name =
  localStorage.getItem("userName") ||
  "Assistant";

const role =
  (localStorage.getItem("userRole") ||
   localStorage.getItem("role") ||
   "").toLowerCase();

if (!email) {
  window.location.href = "login.html";
}

document.getElementById("welcomeText").textContent =
  "Welcome back, " + name + ".";

document.getElementById("emailText").textContent =
  email;


/* LOAD HIRED JOBS */

async function loadHiredJobs() {

  const container = document.getElementById("hiredJobs");

  try {

    const response = await fetch(
      API + "/assistant-hires?email=" +
      encodeURIComponent(email)
    );

    const data = await response.json();

    const jobs = Array.isArray(data)
      ? data
      : (data.hires || data.jobs || []);

    document.getElementById("hiredCount").textContent =
      jobs.length;

    if (!jobs.length) {

      container.innerHTML =
        '<div class="empty">You have no hired jobs yet.</div>';

      return;
    }

    container.innerHTML = "";

    jobs.forEach(function(job) {

      const div = document.createElement("div");

      div.className = "job";

      div.innerHTML = `
        <h3>${job.title || job.jobTitle || "Untitled Job"}</h3>

        <p>
          ${job.description || "No description provided."}
        </p>

        <p>
          Payment:
          ${job.budget || job.amount || job.price || "Not specified"}
        </p>

        <span class="status">
          ${job.status || "Hired"}
        </span>
      `;

      container.appendChild(div);

    });

  } catch (error) {

    container.innerHTML =
      '<div class="empty">Unable to load hired jobs right now.</div>';

  }

}


/* LOAD AVAILABLE JOBS */

async function loadAvailableJobs() {

  const container =
    document.getElementById("availableJobs");

  try {

    const response =
      await fetch(API + "/jobs");

    const data =
      await response.json();

    const jobs =
      Array.isArray(data)
        ? data
        : (data.jobs || []);

    document.getElementById("jobCount").textContent =
      jobs.length;

    if (!jobs.length) {

      container.innerHTML =
        '<div class="empty">No available jobs at the moment.</div>';

      return;
    }

    container.innerHTML = "";

    jobs.forEach(function(job) {

      const div =
        document.createElement("div");

      div.className = "job";

      div.innerHTML = `
        <h3>${job.title || job.jobTitle || "Untitled Job"}</h3>

        <p>
          ${job.description || "No description provided."}
        </p>

        <p>
          Budget:
          ${job.budget || job.amount || job.price || "Not specified"}
        </p>

        <span class="status">
          ${job.status || "Open"}
        </span>
      `;

      container.appendChild(div);

    });

  } catch (error) {

    container.innerHTML =
      '<div class="empty">Unable to load available jobs right now.</div>';

  }

}


/* LOGOUT */

function logout() {

  localStorage.removeItem("userId");
  localStorage.removeItem("userEmail");
  localStorage.removeItem("userName");
  localStorage.removeItem("userRole");
  localStorage.removeItem("email");
  localStorage.removeItem("role");

  window.location.href = "login.html";
}


/* START */

loadHiredJobs();
loadAvailableJobs();

</script>

</body>
</html>
